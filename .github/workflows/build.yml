name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Blackbird.slnx -c Release -warnaserror

      # Renders every window over a fake install with fake Steam and builds, and drives the
      # main interactions with real input. Exits non-zero when any check fails.
      - name: Shots
        run: dotnet run -c Release --no-build --project Blackbird.Shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: Blackbird.Shots/shots/
          if-no-files-found: ignore
